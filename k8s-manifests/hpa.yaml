apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-service-hpa
  namespace: pedidos-veloz
spec:
  # Indica qual serviço o Kubernetes deve monitorar e escalar
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-service
  
  # Definição dos limites de instâncias (mínimo e máximo)
  minReplicas: 2
  maxReplicas: 10
  
  # Regra de disparo: Se o consumo médio de CPU passar de 70%, o K8s cria mais servidores criados automaticamente
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
